name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'
      
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Setup Gradle Wrapper
      run: |
        # 只补 wrapper jar（.properties 已随仓库提交）；本地 gradlew 也已修复并在仓库中。
        # 兜底：若仓库的 gradlew 缺失/不可执行，则重建一个最小启动脚本。
        mkdir -p gradle/wrapper
        if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 120 \
            -o gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar"
        fi
        ls -la gradle/wrapper/
        if [ ! -x ./gradlew ]; then
          cat > gradlew << 'EOF'
        #!/bin/sh
        APP_HOME="$(cd "$(dirname "$0")" && pwd)"
        exec java -Xmx2048m -Xms512m -classpath "$APP_HOME/gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"
        EOF
          chmod +x gradlew
        fi
        head -3 gradlew

    - name: Build Debug APK
      run: |
        export JAVA_HOME=$JAVA_HOME_17_X64
        export PATH=$JAVA_HOME/bin:$PATH
        
        java -version
        ./gradlew --version
        ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
        exit ${PIPESTATUS[0]}
        
    - name: Show build results
      if: always()
      run: |
        echo "=== BUILD LOG (last 200 lines) ==="
        tail -200 build.log 2>/dev/null || echo "(no build.log)"
        echo "=== END LOG ==="
        find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
        ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "Directory not found"
      
    - name: Upload build log
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-log
        path: build.log
        if-no-files-found: ignore
      
    - name: Verify Debug APK signature
      if: success()
      run: |
        APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
        echo "APK=$APK"
        BT=$(ls -d $ANDROID_HOME/build-tools/* 2>/dev/null | sort -V | tail -1)
        echo "build-tools=$BT"
        "$BT/apksigner" verify --print-certs "$APK" 2>&1 || echo "APKSIGNER_VERIFY_FAILED"

    - name: Upload Debug APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: zhenci-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
