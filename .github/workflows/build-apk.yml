name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK with Gradle
      run: |
        echo "=== Java Version ==="
        java -version
        
        echo "=== Gradle Version ==="
        gradle --version
        
        echo "=== Starting Build ==="
        gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || \
        ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
        
        BUILD_EXIT_CODE=${PIPESTATUS[0]}
        echo "Build exit code: $BUILD_EXIT_CODE"
        exit $BUILD_EXIT_CODE
        
    - name: Verify APK Signature
      if: success()
      run: |
        echo "=== APK Output Directory ==="
        ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "Directory not found"
        echo ""
        
        echo "=== Checking APK Signature ==="
        for apk in app/build/outputs/apk/debug/*.apk; do
          if [ -f "$apk" ]; then
            echo "Checking: $apk"
            echo "-- APK Info:"
            ls -lh "$apk"
            echo "-- Signature files in META-INF:"
            unzip -l "$apk" | grep -E "META-INF/.*\.(RSA|DSA|EC|SF|MF)" || echo "WARNING: No signature files found!"
            echo "-- Verifying APK signature with apksigner:"
            $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner verify --verbose "$apk" 2>&1 || echo "WARNING: apksigner verification failed"
            echo ""
          fi
        done
        
    - name: Show build results
      if: always()
      run: |
        echo "=== BUILD LOG (last 150 lines) ==="
        tail -150 build.log
        echo "=== END LOG ==="
        echo "=== Looking for APK files ==="
        find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
        echo "=== APK directory ==="
        ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "Directory not found"
      
    - name: Upload build log
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-log
        path: build.log
        if-no-files-found: ignore
      
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: zhenci-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
