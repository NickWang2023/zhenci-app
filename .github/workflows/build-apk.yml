name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Setup Gradle Wrapper
      run: |
        mkdir -p gradle/wrapper
        
        # 创建 gradle-wrapper.properties
        cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
        networkTimeout=10000
        validateDistributionUrl=true
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        
        # 下载 wrapper jar（使用多个备用源）
        curl -L --retry 3 --retry-delay 2 -o gradle/wrapper/gradle-wrapper.jar \
          "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar" || \
        curl -L --retry 3 --retry-delay 2 -o gradle/wrapper/gradle-wrapper.jar \
          "https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar" || \
        curl -L --retry 3 --retry-delay 2 -o gradle/wrapper/gradle-wrapper.jar \
          "https://services.gradle.org/distributions/gradle-8.5-wrapper.jar"
        
        # 验证wrapper jar是否下载成功
        if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          echo "ERROR: Failed to download gradle-wrapper.jar"
          exit 1
        fi
        
        ls -la gradle/wrapper/gradle-wrapper.jar
        
        # 创建 gradlew 脚本（使用sh兼容语法）
        cat > gradlew << 'GRADLEW'
        #!/bin/sh
        APP_HOME="$(cd "$(dirname "$0")" && pwd)"
        exec java -Xmx2048m -Xms512m -classpath "$APP_HOME/gradle/wrapper/gradle-wrapper.jar" org.gradle.wrapper.GradleWrapperMain "$@"
        GRADLEW
        
        chmod +x gradlew
        
        echo "=== Gradle Wrapper Setup Complete ==="
        ls -la gradlew
        head -3 gradlew

    - name: Build Debug APK
      run: |
        export JAVA_HOME=$JAVA_HOME_17_X64
        export PATH=$JAVA_HOME/bin:$PATH
        
        echo "=== Java Version ==="
        java -version
        
        echo "=== Gradle Wrapper Version ==="
        ./gradlew --version
        
        echo "=== Starting Build ==="
        ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
        BUILD_EXIT_CODE=${PIPESTATUS[0]}
        echo "Build exit code: $BUILD_EXIT_CODE"
        exit $BUILD_EXIT_CODE
        
    - name: Verify APK Signature
      if: success()
      run: |
        echo "=== APK Output Directory ==="
        ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "Directory not found"
        echo ""
        
        echo "=== Checking APK Signature ==="
        for apk in app/build/outputs/apk/debug/*.apk; do
          if [ -f "$apk" ]; then
            echo "Checking: $apk"
            echo "-- APK Info:"
            ls -lh "$apk"
            echo "-- Signature files in META-INF:"
            unzip -l "$apk" | grep -E "META-INF/.*\.(RSA|DSA|EC|SF|MF)" || echo "WARNING: No signature files found!"
            echo "-- Verifying APK signature with apksigner:"
            $ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner verify --verbose "$apk" 2>&1 || echo "WARNING: apksigner verification failed"
            echo ""
          fi
        done
        
    - name: Show build results
      if: always()
      run: |
        echo "=== BUILD LOG (last 200 lines) ==="
        tail -200 build.log
        echo "=== END LOG ==="
        echo "=== Looking for APK files ==="
        find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
        echo "=== APK directory ==="
        ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "Directory not found"
      
    - name: Upload build log
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: build-log
        path: build.log
        if-no-files-found: ignore
      
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: zhenci-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
