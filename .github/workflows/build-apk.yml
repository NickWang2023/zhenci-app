name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Setup Gradle Wrapper
      run: |
        mkdir -p gradle/wrapper
        # Download the correct gradle wrapper jar (much smaller ~53KB)
        curl -L -o gradle/wrapper/gradle-wrapper.jar \
          "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar"
        ls -la gradle/wrapper/

    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew clean assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
        exit ${PIPESTATUS[0]}
      
    - name: Check APK output
      run: |
        echo "=== APK files ==="
        find . -name "*.apk" -type f 2>/dev/null | xargs ls -la
        echo ""
        echo "=== Build outputs ==="
        ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "not found"
        
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: zhenci-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
        
    - name: Upload build log on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-log
        path: build.log
