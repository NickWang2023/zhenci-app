name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Clean and Build Debug APK
      run: |
        ./gradlew clean assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
        exit ${PIPESTATUS[0]}
      
    - name: Check APK output
      run: |
        echo "=== APK Output Directory ==="
        ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "Directory not found"
        echo ""
        echo "=== All APK files ==="
        find . -name "*.apk" -type f 2>/dev/null
        echo ""
        echo "=== Build log (last 50 lines) ==="
        tail -50 build.log
        
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: zhenci-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
        
    - name: Upload build log on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-log
        path: build.log
