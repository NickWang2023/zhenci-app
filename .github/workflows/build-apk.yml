name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Check project structure
      run: |
        echo "=== Project structure ==="
        ls -la
        echo ""
        echo "=== gradlew permissions ==="
        ls -la gradlew
        echo ""
        echo "=== gradle wrapper ==="
        ls -la gradle/wrapper/
        cat gradle/wrapper/gradle-wrapper.properties

    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew --version
        ./gradlew clean assembleDebug --no-daemon --info 2>&1 | tee build.log
        exit ${PIPESTATUS[0]}
      
    - name: Check APK output
      run: |
        echo "=== Build outputs ==="
        ls -la app/build/outputs/ 2>/dev/null || echo "outputs not found"
        echo ""
        echo "=== APK directory ==="
        ls -la app/build/outputs/apk/ 2>/dev/null || echo "apk dir not found"
        echo ""
        echo "=== Debug directory ==="
        ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "debug dir not found"
        echo ""
        echo "=== All APK files ==="
        find . -name "*.apk" -type f 2>/dev/null
        
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: zhenci-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
        
    - name: Upload build log on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-log
        path: build.log
